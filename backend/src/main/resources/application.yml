server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0

spring:
  application:
    name: dearhand-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dearhand}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:dearhand}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:dearhand123}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

razorpay:
  keyId: ${RAZORPAY_KEY_ID:rzp_test_dearhanddemo}
  keySecret: ${RAZORPAY_KEY_SECRET:test_secret_demo12345}
  webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret_dearhand}

dearhand:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    limit-per-minute: ${RATE_LIMITING_LIMIT_PER_MINUTE:15}
